<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空のWebサイト - チェックカレンダー</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafd;
      user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden text-[#3c4043] antialiased">

  <!-- タイトルバー -->
  <div class="bg-[#202124] text-[#e8eaed] text-xs px-3 py-1 flex items-center justify-between select-none shrink-0 border-b border-[#3c4043]/40">
    <span class="font-medium tracking-wide">空のWebサイト</span>
    <span class="text-[11px] text-gray-400">チェックカレンダー - 達成度黄緑ヒートマップ対応</span>
  </div>

  <div class="flex flex-1 overflow-hidden relative">
    <!-- サイドバー -->
    <aside id="sidebar" class="hidden w-[260px] min-w-[260px] bg-[#f8fafd] flex-col pt-3 px-3 z-30 select-none border-r border-gray-200/70">
      <div class="flex items-center h-10 mb-2 pl-1">
        <button id="closeSidebarBtn" class="p-2 rounded-full hover:bg-gray-200 transition-colors text-gray-700" title="メニューを閉じる">
          <i data-lucide="x" class="w-6 h-6 stroke-[1.8]"></i>
        </button>
      </div>

      <!-- + 作成 ▾ ボタン -->
      <div class="mb-3 pl-1">
        <button id="createEventBtn" class="w-full flex items-center gap-2.5 px-4 py-3 rounded-2xl bg-white border border-gray-200/80 shadow-[0_1px_3px_0_rgba(60,64,67,0.3),0_4px_8px_3px_rgba(60,64,67,0.15)] hover:shadow-[0_2px_6px_2px_rgba(60,64,67,0.3),0_6px_10px_4px_rgba(60,64,67,0.15)] transition-all cursor-pointer group">
          <i data-lucide="plus" class="w-5 h-5 text-[#3c4043] stroke-[2.4]"></i>
          <span class="text-sm font-medium text-gray-700">目標・やること追加</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-gray-500 ml-auto"></i>
        </button>
      </div>

      <!-- 達成度カラー凡例 -->
      <div class="mb-3 px-2 py-2 bg-white/70 border border-gray-200/70 rounded-xl">
        <span class="text-[10px] font-semibold text-gray-500 block mb-1">
          その日のタスク達成度
        </span>
        <div class="flex items-center justify-between text-[10px] text-gray-500">
          <span>0%</span>
          <div class="flex items-center gap-1">
            <span class="w-3.5 h-3.5 rounded bg-gray-100 border border-gray-200" title="未完了"></span>
            <span class="w-3.5 h-3.5 rounded bg-[#f7fee7] border border-lime-200" title="一部達成"></span>
            <span class="w-3.5 h-3.5 rounded bg-[#bef264] border border-lime-300" title="50%以上達成"></span>
            <span class="w-3.5 h-3.5 rounded bg-[#84cc16] border border-lime-500" title="100%達成！"></span>
          </div>
          <span class="text-lime-700 font-bold">100%</span>
        </div>
      </div>

      <!-- タグフィルター -->
      <div class="mb-4 px-1">
        <span class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider block mb-1.5 flex items-center gap-1">
          <i data-lucide="filter" class="w-3 h-3"></i>
          タグで絞り込み
        </span>
        <div id="filterTagGroup" class="flex flex-wrap gap-1">
          <button data-filter="ALL" class="filter-btn text-[11px] px-2.5 py-1 rounded-full bg-[#1a73e8] text-white font-medium transition-all">すべて</button>
          <button data-filter="勉強" class="filter-btn text-[11px] px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-700 hover:border-gray-300 transition-all">#勉強</button>
          <button data-filter="仕事" class="filter-btn text-[11px] px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-700 hover:border-gray-300 transition-all">#仕事</button>
          <button data-filter="運動" class="filter-btn text-[11px] px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-700 hover:border-gray-300 transition-all">#運動</button>
          <button data-filter="読書" class="filter-btn text-[11px] px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-700 hover:border-gray-300 transition-all">#読書</button>
        </div>
      </div>

      <!-- ミニカレンダー -->
      <div class="px-1">
        <div class="flex items-center justify-between mb-2 px-1">
          <span id="miniMonthTitle" class="text-sm font-medium text-gray-700">2026年 11月</span>
          <div class="flex items-center space-x-0.5 text-gray-600">
            <button id="miniPrevBtn" class="p-1 rounded-full hover:bg-gray-200 transition-colors">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <button id="miniNextBtn" class="p-1 rounded-full hover:bg-gray-200 transition-colors">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-7 text-center mb-1 text-[11px] font-medium text-gray-500">
          <div class="py-0.5">日</div>
          <div class="py-0.5">月</div>
          <div class="py-0.5">火</div>
          <div class="py-0.5">水</div>
          <div class="py-0.5">木</div>
          <div class="py-0.5">金</div>
          <div class="py-0.5">土</div>
        </div>

        <div id="miniCalendarGrid" class="grid grid-cols-7 text-center text-xs"></div>
      </div>

      <!-- 進捗バー -->
      <div class="mt-auto pt-3 pb-2 border-t border-gray-200/80 px-2">
        <div class="flex items-center justify-between text-xs font-medium text-gray-600 mb-1.5">
          <span class="flex items-center gap-1.5">
            <i data-lucide="flame" class="w-3.5 h-3.5 text-orange-500"></i>
            日々の目標達成
          </span>
          <span id="taskProgressText" class="text-[11px] bg-orange-50 text-orange-600 font-semibold px-2 py-0.5 rounded-full">0 / 0 日</span>
        </div>
        <div class="w-full bg-gray-200 h-1.5 rounded-full overflow-hidden">
          <div id="taskProgressBar" class="bg-orange-500 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </aside>

    <!-- メイン領域 -->
    <div class="flex-1 flex flex-col h-full overflow-hidden p-3 pl-3">
      <!-- 上部ヘッダー -->
      <header class="flex items-center justify-between h-14 px-2 select-none mb-1">
        <div class="flex items-center space-x-2 sm:space-x-3">
          <button id="openSidebarBtn" class="flex flex-col items-center justify-center w-12 h-12 rounded-full hover:bg-gray-200 transition-colors text-gray-700 mr-1" title="メニューを開く">
            <i data-lucide="menu" class="w-5 h-5 stroke-[2]"></i>
            <span class="text-[10px] leading-tight font-normal text-gray-700 -mt-0.5">メニュー</span>
          </button>

          <button id="todayBtn" class="px-4 py-1.5 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors">
            今日
          </button>

          <div class="flex items-center space-x-1">
            <button id="prevBtn" class="p-2 rounded-full hover:bg-gray-200 text-gray-600 transition-colors">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <button id="nextBtn" class="p-2 rounded-full hover:bg-gray-200 text-gray-600 transition-colors">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>

          <h1 id="headerTitle" class="text-xl font-medium text-gray-800 ml-2 tracking-tight">
            2026年 11月
          </h1>

          <div class="hidden md:flex items-center gap-1.5 ml-3 px-2.5 py-1 bg-white border border-gray-200 rounded-full text-[11px] text-gray-500 shadow-2xs">
            <span>達成度:</span>
            <span class="w-2.5 h-2.5 rounded-full bg-gray-200" title="0%"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-[#d9f99d]" title="一部達成"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-[#bef264]" title="50%以上"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-[#84cc16]" title="100%達成！"></span>
          </div>
        </div>

        <div class="flex items-center space-x-1 sm:space-x-2">
          <div id="searchContainer" class="hidden items-center bg-gray-100 rounded-full px-3 py-1 border border-gray-300">
            <i data-lucide="search" class="w-4 h-4 text-gray-500 mr-2"></i>
            <input id="searchInput" type="text" placeholder="全体目標・1日の目標を検索..." class="bg-transparent border-none outline-none text-xs text-gray-700 w-36 sm:w-48">
            <button id="closeSearchBtn" class="text-gray-400 hover:text-gray-600 ml-1">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <button id="openSearchBtn" class="p-2 rounded-full hover:bg-gray-200 text-gray-600 transition-colors" title="検索">
            <i data-lucide="search" class="w-5 h-5"></i>
          </button>

          <button onclick="alert('【達成度黄緑カラー機能】\n・タスクを完了すると、その日の達成度に応じてカレンダーの日付マスが黄緑色（ライトグリーン〜ライムグリーン）に変化します！\n・年間表示でも日々の達成度が黄緑の草生やし（ヒートマップ）として一目で振り返ることができます！')" class="p-2 rounded-full hover:bg-gray-200 text-gray-600 transition-colors" title="サポート">
            <i data-lucide="help-circle" class="w-5 h-5"></i>
          </button>

          <button id="resetDataBtn" class="p-2 rounded-full hover:bg-gray-200 text-gray-600 transition-colors" title="データ初期化">
            <i data-lucide="settings" class="w-5 h-5"></i>
          </button>

          <!-- ビュー切替ドロップダウン -->
          <div class="relative">
            <button id="viewDropdownBtn" class="flex items-center space-x-1.5 px-3 py-1.5 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors ml-1">
              <span id="currentViewLabel">月</span>
              <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-gray-500"></i>
            </button>

            <div id="viewDropdownMenu" class="absolute right-0 mt-1 w-36 bg-white border border-gray-200 rounded-lg shadow-lg py-1 z-50 hidden">
              <button id="selectMonthView" class="w-full text-left px-4 py-2 text-xs flex items-center justify-between hover:bg-gray-100 text-[#1a73e8] font-semibold">
                <span>月表示</span>
              </button>
              <button id="selectYearView" class="w-full text-left px-4 py-2 text-xs flex items-center justify-between hover:bg-gray-100 text-gray-700">
                <span>年表示</span>
              </button>
              <button id="selectCheckListView" class="w-full text-left px-4 py-2 text-xs flex items-center justify-between hover:bg-gray-100 text-gray-700">
                <span>チェック一覧</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- 月表示コンテナ (黄緑ヒートマップ背景) -->
      <main id="monthViewContainer" class="flex-1 flex flex-col bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-xs">
        <div class="grid grid-cols-7 border-b border-gray-200 text-center py-2 text-xs font-medium text-gray-500 bg-white">
          <div class="flex justify-center"><span class="text-red-500 font-semibold">日</span></div>
          <div class="flex justify-center"><span>月</span></div>
          <div class="flex justify-center"><span>火</span></div>
          <div class="flex justify-center"><span>水</span></div>
          <div class="flex justify-center"><span>木</span></div>
          <div class="flex justify-center"><span>金</span></div>
          <div class="flex justify-center"><span class="text-blue-500">土</span></div>
        </div>
        <div id="mainCalendarGrid" class="flex-1 grid grid-cols-7 bg-white"></div>
      </main>

      <!-- 年表示コンテナ (草生やし年間ヒートマップ) -->
      <main id="yearViewContainer" class="flex-1 bg-white border border-gray-200 rounded-2xl overflow-y-auto p-4 sm:p-6 shadow-xs hidden">
        <div id="yearCalendarGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-8 gap-y-6 max-w-7xl mx-auto"></div>
      </main>

      <!-- チェック一覧コンテナ -->
      <main id="checkListViewContainer" class="flex-1 flex flex-col bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-xs p-6 hidden">
        <div class="flex items-center justify-between pb-4 border-b border-gray-200 mb-4">
          <div>
            <h2 class="text-lg font-medium text-gray-800 flex items-center gap-2">
              <i data-lucide="target" class="w-5 h-5 text-[#1a73e8]"></i>
              目標・やること進捗一覧
            </h2>
            <p class="text-xs text-gray-500 mt-0.5">全体の目標と日々の達成状況を一覧で管理できます</p>
          </div>
          <button id="addFromCheckListBtn" class="flex items-center gap-1.5 px-4 py-2 bg-[#1a73e8] text-white text-xs font-medium rounded-lg hover:bg-[#174ea6] transition-colors shadow-xs">
            <i data-lucide="plus" class="w-4 h-4"></i>
            新規目標を追加
          </button>
        </div>
        <div id="checkListGrid" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
      </main>
    </div>
  </div>

  <!-- 目標作成・編集モーダル -->
  <div id="eventModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-gray-100" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-6 py-4 bg-gray-50 border-b border-gray-100">
        <h3 id="modalTitle" class="text-base font-semibold text-gray-800 flex items-center gap-2">
          <i data-lucide="target" class="w-4 h-4 text-[#1a73e8]"></i>
          目標・やることの設定
        </h3>
        <button id="modalCloseBtn" class="p-1.5 rounded-full hover:bg-gray-200 text-gray-500 transition-colors">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="eventForm" class="p-6 space-y-4">
        <input type="hidden" id="eventId">

        <!-- ① 全体の目標 -->
        <div class="bg-blue-50/50 p-3.5 rounded-xl border border-blue-100">
          <label class="block text-xs font-bold text-[#1a73e8] mb-1 flex items-center gap-1.5">
            <i data-lucide="target" class="w-3.5 h-3.5"></i>
            ① 全体の目標（ゴール） <span className="text-red-500">*</span>
          </label>
          <p class="text-[11px] text-gray-500 mb-2">期間全体を通して達成したい最終ゴールを入力してください</p>
          <input id="overallGoalInput" type="text" required placeholder="例: 英単語ターゲット1900 完走、基本情報過去問3年分制覇" class="w-full px-3.5 py-2.5 text-sm bg-white border border-blue-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1a73e8]">
        </div>

        <!-- ② 1日に達成する目標 -->
        <div class="bg-emerald-50/50 p-3.5 rounded-xl border border-emerald-100">
          <label class="block text-xs font-bold text-emerald-700 mb-1 flex items-center gap-1.5">
            <i data-lucide="flame" class="w-3.5 h-3.5"></i>
            ② 1日に達成する目標（日々のノルマ）
          </label>
          <p class="text-[11px] text-gray-500 mb-2">カレンダーの各マスに表示され、毎日チェックできる目標です</p>
          <input id="dailyGoalInput" type="text" placeholder="例: 1日50単語暗記＋復習テスト、1日午前過去問20問解く" class="w-full px-3.5 py-2.5 text-sm bg-white border border-emerald-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600">
        </div>

        <!-- やる期間 -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5 flex items-center justify-between">
            <span class="flex items-center gap-1">
              <i data-lucide="clock" class="w-3 h-3"></i>
              やる期間（期間指定）
            </span>
            <span id="periodDaysPreview" class="text-[11px] text-[#1a73e8] font-medium font-mono">1日間</span>
          </label>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <span class="block text-[11px] text-gray-500 mb-1">開始日</span>
              <input id="eventStartDateInput" type="date" required class="w-full px-2.5 py-2 text-xs border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1a73e8]">
            </div>
            <div>
              <span class="block text-[11px] text-gray-500 mb-1">終了日</span>
              <input id="eventEndDateInput" type="date" required class="w-full px-2.5 py-2 text-xs border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1a73e8]">
            </div>
          </div>
        </div>

        <!-- タグ -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5 flex items-center gap-1">
            <i data-lucide="tag" class="w-3 h-3"></i>
            タグ（カテゴリー）
          </label>
          <div class="flex flex-wrap gap-1.5 mb-2">
            <button type="button" data-tag="勉強" data-color="blue" class="tag-preset-btn text-xs px-2.5 py-1 rounded-lg border bg-blue-50 border-[#1a73e8] text-[#1a73e8] font-semibold transition-all">📚 勉強</button>
            <button type="button" data-tag="仕事" data-color="yellow" class="tag-preset-btn text-xs px-2.5 py-1 rounded-lg border bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100 transition-all">💼 仕事</button>
            <button type="button" data-tag="運動" data-color="green" class="tag-preset-btn text-xs px-2.5 py-1 rounded-lg border bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100 transition-all">🏃 運動</button>
            <button type="button" data-tag="読書" data-color="purple" class="tag-preset-btn text-xs px-2.5 py-1 rounded-lg border bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100 transition-all">📖 読書</button>
            <button type="button" data-tag="趣味" data-color="red" class="tag-preset-btn text-xs px-2.5 py-1 rounded-lg border bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100 transition-all">🎨 趣味</button>
          </div>
          <input id="eventTagInput" type="text" value="勉強" placeholder="または自由入力（例: 資格対策、プログラミング）" class="w-full px-3 py-1.5 text-xs border border-gray-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-[#1a73e8]">
        </div>

        <!-- カラー -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">タグカラー</label>
          <div class="flex items-center gap-3" id="colorPickerGroup">
            <button type="button" data-color="blue" class="color-btn w-7 h-7 rounded-full bg-[#1a73e8] ring-2 ring-offset-2 ring-blue-500 scale-125 transition-all"></button>
            <button type="button" data-color="green" class="color-btn w-7 h-7 rounded-full bg-[#137333] transition-all"></button>
            <button type="button" data-color="red" class="color-btn w-7 h-7 rounded-full bg-[#d93025] transition-all"></button>
            <button type="button" data-color="yellow" class="color-btn w-7 h-7 rounded-full bg-[#f9ab00] transition-all"></button>
            <button type="button" data-color="purple" class="color-btn w-7 h-7 rounded-full bg-[#a142f4] transition-all"></button>
          </div>
        </div>

        <div class="flex items-center justify-between pt-4 border-t border-gray-100">
          <button type="button" id="deleteEventBtn" class="hidden items-center gap-1.5 px-3 py-2 text-xs font-medium text-red-600 hover:bg-red-50 rounded-lg">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            削除
          </button>
          <div class="flex items-center space-x-2 ml-auto">
            <button type="button" id="modalCancelBtn" class="px-4 py-2 text-xs font-medium text-gray-600 hover:bg-gray-100 rounded-xl">キャンセル</button>
            <button type="submit" class="px-5 py-2 text-xs font-medium bg-[#1a73e8] hover:bg-[#174ea6] text-white rounded-xl shadow-xs">保存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    function formatDateKey(y, m, d) {
      return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function calculateDaysCount(start, end) {
      if (!start || !end) return 1;
      const d1 = new Date(start);
      const d2 = new Date(end);
      const diff = Math.ceil((d2.getTime() - d1.getTime()) / (1000 * 60 * 60 * 24)) + 1;
      return diff > 0 ? diff : 1;
    }

    function getJapaneseHolidays(year) {
      const holidays = {};
      const add = (m, d, name) => { holidays[formatDateKey(year, m, d)] = name; };
      const getNthMonday = (m, nth) => {
        const firstDay = new Date(year, m - 1, 1).getDay();
        const firstMonday = (8 - firstDay) % 7 || 7;
        return firstMonday + (nth - 1) * 7;
      };
      const getVernalEquinoxDay = (y) => Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
      const getAutumnEquinoxDay = (y) => Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));

      add(1, 1, '元日');
      add(1, getNthMonday(1, 2), '成人の日');
      add(2, 11, '建国記念の日');
      if (year >= 2020) add(2, 23, '天皇誕生日');
      add(3, getVernalEquinoxDay(year), '春分の日');
      add(4, 29, '昭和の日');
      add(5, 3, '憲法記念日');
      add(5, 4, 'みどりの日');
      add(5, 5, 'こどもの日');
      add(7, getNthMonday(7, 3), '海の日');
      if (year >= 2016) add(8, 11, '山の日');
      const keiro = getNthMonday(9, 3);
      const shubun = getAutumnEquinoxDay(year);
      add(9, keiro, '敬老の日');
      add(9, shubun, '秋分の日');
      if (shubun - keiro === 2) add(9, keiro + 1, '国民の休日');
      add(10, getNthMonday(10, 2), 'スポーツの日');
      add(11, 3, '文化の日');
      add(11, 15, '七五三');
      add(11, 23, '勤労感謝の日');

      const sortedDates = Object.keys(holidays).sort();
      const substitutes = {};
      sortedDates.forEach((dateStr) => {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        if (dateObj.getDay() === 0) {
          let subDate = new Date(y, m - 1, d + 1);
          while (true) {
            const subKey = formatDateKey(subDate.getFullYear(), subDate.getMonth() + 1, subDate.getDate());
            if (!holidays[subKey] && !substitutes[subKey]) {
              substitutes[subKey] = '振替休日';
              break;
            }
            subDate.setDate(subDate.getDate() + 1);
          }
        }
      });

      return { ...holidays, ...substitutes };
    }

    const DEFAULT_TASKS = [
      { id: 't-1', overallGoal: '英単語ターゲット1900 完走', dailyGoal: '1日50単語暗記＆確認テスト', startDate: '2026-11-04', endDate: '2026-11-08', tag: '勉強', color: 'blue', completedDates: { '2026-11-04': true, '2026-11-05': true, '2026-11-06': true } },
      { id: 't-2', overallGoal: '基本情報技術者 午前過去問 3年分制覇', dailyGoal: '午前過去問 20問解答＆見直し', startDate: '2026-11-16', endDate: '2026-11-20', tag: '勉強', color: 'purple', completedDates: { '2026-11-16': true } },
      { id: 't-3', overallGoal: '毎日ランニング習慣', dailyGoal: '朝3kmジョギング', startDate: '2026-11-01', endDate: '2026-11-07', tag: '運動', color: 'green', completedDates: { '2026-11-01': true, '2026-11-02': true, '2026-11-03': true, '2026-11-04': true } },
    ];

    let userEvents = [];
    try {
      const saved = localStorage.getItem('check_calendar_events');
      userEvents = saved ? JSON.parse(saved) : DEFAULT_TASKS;
    } catch(e) {
      userEvents = DEFAULT_TASKS;
    }

    function saveUserEvents() {
      localStorage.setItem('check_calendar_events', JSON.stringify(userEvents));
      updateProgress();
    }

    let currentYear = 2026;
    let currentMonth = 11;
    let selectedDate = '2026-11-01';
    const todayKey = '2026-11-11';
    let currentColor = 'blue';
    let searchQuery = '';
    let selectedFilterTag = 'ALL';
    let currentView = 'month';

    const weekDayNames = ['日', '月', '火', '水', '木', '金', '土'];

    const colorClasses = {
      green: { bg: 'bg-[#137333]', border: 'border-[#137333]', text: 'text-white' },
      blue: { bg: 'bg-[#1a73e8]', border: 'border-[#1a73e8]', text: 'text-white' },
      red: { bg: 'bg-[#d93025]', border: 'border-[#d93025]', text: 'text-white' },
      yellow: { bg: 'bg-[#f9ab00]', border: 'border-[#f9ab00]', text: 'text-[#202124]' },
      purple: { bg: 'bg-[#a142f4]', border: 'border-[#a142f4]', text: 'text-white' },
    };

    // 日付ごとの達成度を計算（0.0〜1.0）
    function getDayAchievement(dateKey) {
      const tasksOnDate = userEvents.filter(ev => {
        if (ev.isHoliday) return false;
        const s = ev.startDate;
        const e = ev.endDate || ev.startDate;
        return s <= dateKey && dateKey <= e;
      });

      if (tasksOnDate.length === 0) return { hasTask: false, total: 0, completed: 0, rate: 0 };
      const completed = tasksOnDate.filter(ev => !!ev.completedDates?.[dateKey]).length;
      return { hasTask: true, total: tasksOnDate.length, completed, rate: completed / tasksOnDate.length };
    }

    // 月表示用セル背景色クラス
    function getMonthCellBgClass(dateKey) {
      const ach = getDayAchievement(dateKey);
      if (!ach.hasTask || ach.rate === 0) return 'bg-white';
      if (ach.rate === 1.0) return 'bg-[#d9f99d]/75 border-lime-300';
      if (ach.rate >= 0.5) return 'bg-[#ecfccb]/70 border-lime-200';
      return 'bg-[#f7fee7]/70 border-lime-100';
    }

    // 年表示用日付スタイル
    function getYearDayStyle(dateKey, isCurrent, isSun, isHol, isToday, isSelected) {
      if (isToday) return 'bg-[#1a73e8] text-white font-medium shadow-xs';
      if (isSelected) return 'bg-[#d2e3fc] text-[#174ea6] font-medium';

      const ach = getDayAchievement(dateKey);
      if (ach.hasTask && ach.rate > 0) {
        if (ach.rate === 1.0) return 'bg-[#84cc16] text-white font-bold shadow-xs';
        if (ach.rate >= 0.5) return 'bg-[#bef264] text-lime-900 font-semibold';
        return 'bg-[#d9f99d] text-lime-800 font-medium';
      }

      if (!isCurrent) return 'text-gray-300 hover:bg-gray-50';
      if (isSun || isHol) return 'text-red-600 font-semibold hover:bg-red-50';
      return 'text-gray-800 hover:bg-gray-100';
    }

    function getAllEvents(y) {
      const holidays = getJapaneseHolidays(y);
      const list = [...userEvents];
      Object.entries(holidays).forEach(([dateStr, name]) => {
        if (!list.some(e => e.startDate === dateStr && (e.overallGoal === name || e.title === name))) {
          list.push({
            id: `sys-holiday-${dateStr}`,
            overallGoal: name,
            dailyGoal: '',
            startDate: dateStr,
            endDate: dateStr,
            tag: '祝日',
            color: 'green',
            completedDates: {},
            isHoliday: true
          });
        }
      });
      return { list, holidays };
    }

    function generateMonthDays(year, month) {
      const firstDay = new Date(year, month - 1, 1);
      const startDay = firstDay.getDay();
      const daysInMonth = new Date(year, month, 0).getDate();
      const daysInPrev = new Date(year, month - 1, 0).getDate();

      const days = [];
      for (let i = startDay - 1; i >= 0; i--) {
        const d = daysInPrev - i;
        const prevDate = new Date(year, month - 2, d);
        days.push({ num: d, dateKey: formatDateKey(prevDate.getFullYear(), prevDate.getMonth() + 1, d), isCurrent: false, dayNum: d });
      }
      for (let d = 1; d <= daysInMonth; d++) {
        days.push({ num: d, dateKey: formatDateKey(year, month, d), isCurrent: true, dayNum: d });
      }
      const remaining = 42 - days.length;
      for (let d = 1; d <= remaining; d++) {
        const nextDate = new Date(year, month, d);
        days.push({ num: d, dateKey: formatDateKey(nextDate.getFullYear(), nextDate.getMonth() + 1, d), isCurrent: false, dayNum: d });
      }
      return days;
    }

    function renderView() {
      const { holidays } = getAllEvents(currentYear);

      if (currentView === 'year') {
        document.getElementById('headerTitle').textContent = `${currentYear}年`;
        document.getElementById('currentViewLabel').textContent = '年';
        document.getElementById('monthViewContainer').classList.add('hidden');
        document.getElementById('checkListViewContainer').classList.add('hidden');
        document.getElementById('yearViewContainer').classList.remove('hidden');
        renderYearCalendar(holidays);
      } else if (currentView === 'checklist') {
        document.getElementById('headerTitle').textContent = `${currentYear}年 目標一覧`;
        document.getElementById('currentViewLabel').textContent = 'チェック一覧';
        document.getElementById('monthViewContainer').classList.add('hidden');
        document.getElementById('yearViewContainer').classList.add('hidden');
        document.getElementById('checkListViewContainer').classList.remove('hidden');
        renderCheckList();
      } else {
        document.getElementById('headerTitle').textContent = `${currentYear}年 ${currentMonth}月`;
        document.getElementById('currentViewLabel').textContent = '月';
        document.getElementById('yearViewContainer').classList.add('hidden');
        document.getElementById('checkListViewContainer').classList.add('hidden');
        document.getElementById('monthViewContainer').classList.remove('hidden');
        document.getElementById('monthViewContainer').classList.add('flex');
        renderMainCalendar(holidays);
      }

      renderMiniCalendar();
      updateProgress();
    }

    function renderMainCalendar(holidays) {
      document.getElementById('miniMonthTitle').textContent = `${currentYear}年 ${currentMonth}月`;
      const mainGrid = document.getElementById('mainCalendarGrid');
      mainGrid.innerHTML = '';

      const { list: allList } = getAllEvents(currentYear);

      const firstDay = new Date(currentYear, currentMonth - 1, 1);
      const startDay = firstDay.getDay();
      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
      const daysInPrev = new Date(currentYear, currentMonth - 1, 0).getDate();

      const days = [];
      for (let i = startDay - 1; i >= 0; i--) {
        const d = daysInPrev - i;
        const prevDate = new Date(currentYear, currentMonth - 2, d);
        const k = formatDateKey(prevDate.getFullYear(), prevDate.getMonth() + 1, d);
        days.push({ dateKey: k, display: d === 1 ? `${prevDate.getMonth() + 1}月1日` : `${d}`, isCurrent: false, dayNum: d, isHol: !!holidays[k] });
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const k = formatDateKey(currentYear, currentMonth, d);
        days.push({ dateKey: k, display: d === 1 ? `${currentMonth}月1日` : `${d}`, isCurrent: true, dayNum: d, isHol: !!holidays[k] });
      }
      const totalSlots = days.length <= 35 ? 35 : 42;
      const remaining = totalSlots - days.length;
      for (let d = 1; d <= remaining; d++) {
        const nextDate = new Date(currentYear, currentMonth, d);
        const k = formatDateKey(nextDate.getFullYear(), nextDate.getMonth() + 1, d);
        days.push({ dateKey: k, display: d === 1 ? `${nextDate.getMonth() + 1}月1日` : `${d}`, isCurrent: false, dayNum: d, isHol: !!holidays[k] });
      }

      mainGrid.className = `flex-1 grid grid-cols-7 ${totalSlots > 35 ? 'grid-rows-6' : 'grid-rows-5'} bg-white`;

      days.forEach((cell, idx) => {
        const isColRight = (idx + 1) % 7 !== 0;
        const totalRows = totalSlots / 7;
        const isRowBottom = Math.floor(idx / 7) < totalRows - 1;
        const isSunOrHol = (idx % 7 === 0) || cell.isHol;
        const bgClass = getMonthCellBgClass(cell.dateKey);
        const ach = getDayAchievement(cell.dateKey);

        const cellDiv = document.createElement('div');
        cellDiv.className = `flex flex-col p-1 relative group transition-colors cursor-pointer overflow-hidden ${bgClass} ${
          isColRight ? 'border-r border-gray-200' : ''
        } ${isRowBottom ? 'border-b border-gray-200' : ''} ${
          selectedDate === cell.dateKey ? 'ring-2 ring-inset ring-blue-500' : ''
        } hover:brightness-98`;

        cellDiv.onclick = () => {
          selectedDate = cell.dateKey;
          openModal(cell.dateKey, cell.dateKey, '勉強');
        };

        const isToday = cell.dateKey === todayKey;
        let dayNumHtml = '';
        if (isToday) {
          dayNumHtml = `<div class="w-6 h-6 rounded-full bg-[#1a73e8] text-white flex items-center justify-center text-xs font-medium shadow-xs">${cell.dayNum}</div>`;
        } else {
          const colIdx = idx % 7;
          let textColor = cell.isCurrent ? (isSunOrHol ? 'text-red-600 font-semibold' : colIdx === 6 ? 'text-blue-600' : 'text-gray-800') : 'text-gray-400 font-light';
          dayNumHtml = `<span class="text-xs ${textColor}">${cell.display}</span>`;
        }

        const dateHeader = document.createElement('div');
        dateHeader.className = 'flex justify-between items-center h-6 px-1 mb-1 shrink-0';

        const badgeLeft = ach.hasTask ? `<span class="text-[9px] font-bold px-1 rounded-sm ${ach.rate === 1.0 ? 'bg-[#84cc16] text-white' : ach.rate > 0 ? 'bg-lime-200 text-lime-900' : 'text-gray-400'}">${ach.completed}/${ach.total}</span>` : '<div class="w-4"></div>';
        const starRight = (ach.hasTask && ach.rate === 1.0) ? '<span class="text-[10px]" title="全タスク達成！">🌟</span>' : '<div class="w-4"></div>';

        dateHeader.innerHTML = `${badgeLeft}${dayNumHtml}${starRight}`;
        cellDiv.appendChild(dateHeader);

        const eventsContainer = document.createElement('div');
        eventsContainer.className = 'flex-1 flex flex-col gap-1 overflow-y-auto no-scrollbar';

        const dayEvents = allList.filter(e => {
          const oGoal = e.overallGoal || e.title || '';
          const dGoal = e.dailyGoal || '';
          const tag = e.tag || '';
          if (searchQuery && !oGoal.toLowerCase().includes(searchQuery.toLowerCase()) && !dGoal.toLowerCase().includes(searchQuery.toLowerCase()) && !tag.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          if (selectedFilterTag !== 'ALL' && e.tag !== selectedFilterTag) return false;
          const s = e.startDate;
          const end = e.endDate || e.startDate;
          return s <= cell.dateKey && cell.dateKey <= end;
        });

        dayEvents.forEach(ev => {
          const c = colorClasses[ev.color] || colorClasses.blue;
          const isDailyDone = !!ev.completedDates?.[cell.dateKey];

          if (ev.isHoliday) {
            const holEl = document.createElement('div');
            holEl.className = 'bg-[#137333] text-white text-[11px] leading-tight px-1.5 py-0.5 rounded font-normal truncate shadow-xs';
            holEl.textContent = ev.overallGoal;
            eventsContainer.appendChild(holEl);
            return;
          }

          const evEl = document.createElement('div');
          evEl.className = `flex flex-col p-1 text-[11px] leading-tight font-normal rounded shadow-xs transition-all cursor-pointer border ${
            isDailyDone ? 'bg-lime-50/90 border-lime-300 text-gray-500' : `${c.bg} text-white ${c.border}`
          } hover:brightness-95`;
          evEl.title = `【全体の目標】${ev.overallGoal}\n【1日の目標】${ev.dailyGoal || 'なし'}`;

          const displayTarget = ev.dailyGoal ? ev.dailyGoal : ev.overallGoal;
          const subTargetHtml = ev.dailyGoal ? `<div class="text-[9px] truncate pl-4.5 mt-0.5 flex items-center gap-1 ${isDailyDone ? 'text-gray-400' : 'text-white/80'}"><span class="truncate">🎯 ${ev.overallGoal}</span></div>` : '';

          evEl.innerHTML = `
            <div class="flex items-center gap-1">
              <button class="w-3.5 h-3.5 rounded flex items-center justify-center border shrink-0 transition-colors ${
                isDailyDone ? 'bg-[#84cc16] border-[#84cc16] text-white shadow-2xs' : 'bg-white/20 border-white/80 hover:bg-white/40 text-white'
              }" onclick="event.stopPropagation(); toggleDailyComplete('${ev.id}', '${cell.dateKey}')">
                ${isDailyDone ? '<svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>' : ''}
              </button>
              <span class="truncate font-medium ${isDailyDone ? 'line-through text-gray-500' : 'text-white'}">${displayTarget}</span>
            </div>
            ${subTargetHtml}
          `;

          evEl.onclick = (e) => {
            e.stopPropagation();
            openEditModal(ev);
          };
          eventsContainer.appendChild(evEl);
        });

        cellDiv.appendChild(eventsContainer);
        mainGrid.appendChild(cellDiv);
      });
    }

    function renderYearCalendar(holidays) {
      const yearGrid = document.getElementById('yearCalendarGrid');
      yearGrid.innerHTML = '';

      for (let m = 1; m <= 12; m++) {
        const monthCard = document.createElement('div');
        monthCard.className = 'flex flex-col';

        const header = document.createElement('div');
        header.className = 'mb-2';
        header.innerHTML = `
          <button class="text-sm font-semibold text-gray-800 hover:text-[#1a73e8] transition-colors" onclick="switchToMonth(${m})">
            ${m}月
          </button>
        `;
        monthCard.appendChild(header);

        const weekRow = document.createElement('div');
        weekRow.className = 'grid grid-cols-7 text-center mb-1 text-[11px] font-medium text-gray-500';
        weekDayNames.forEach(d => {
          const col = document.createElement('div');
          col.className = 'py-0.5';
          col.textContent = d;
          weekRow.appendChild(col);
        });
        monthCard.appendChild(weekRow);

        const daysGrid = document.createElement('div');
        daysGrid.className = 'grid grid-cols-7 text-center text-xs';

        const monthDays = generateMonthDays(currentYear, m);
        monthDays.forEach((d, idx) => {
          const isHol = !!holidays[d.dateKey];
          const isSun = (idx % 7 === 0);
          const ach = getDayAchievement(d.dateKey);
          const dayStyle = getYearDayStyle(d.dateKey, d.isCurrent, isSun, isHol, d.dateKey === todayKey, d.dateKey === selectedDate);

          const btn = document.createElement('button');
          btn.className = `h-6 w-6 mx-auto my-0.5 rounded-full flex items-center justify-center transition-all text-[11px] ${dayStyle}`;
          btn.textContent = d.num;
          btn.title = `${d.dateKey}${ach.hasTask ? ` (達成度: ${Math.round(ach.rate * 100)}% - ${ach.completed}/${ach.total}件)` : ''}${isHol ? ` [${holidays[d.dateKey]}]` : ''}`;
          btn.onclick = () => {
            selectedDate = d.dateKey;
            currentMonth = m;
            currentView = 'month';
            renderView();
          };
          daysGrid.appendChild(btn);
        });

        monthCard.appendChild(daysGrid);
        yearGrid.appendChild(monthCard);
      }
    }

    function renderCheckList() {
      const container = document.getElementById('checkListGrid');

      if (userEvents.length === 0) {
        container.innerHTML = `
          <div class="h-48 flex flex-col items-center justify-center text-gray-400">

          <div class="flex items-start justify-between">
            <div class="space-y-1">
              <div class="flex items-center gap-2">

                <span class="text-base font-bold text-gray-800">${t.overallGoal}</span>
                ${t.tag ? `<span class="text-[11px] px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 font-medium">#${t.tag}</span>` : ''}
              </div>
              ${t.dailyGoal ? `
                <div class="flex items-center gap-2 text-sm text-gray-700 pl-1 mt-1">
                  <span class="text-xs font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">1日の目標</span>
                  <span class="font-medium text-gray-800">${t.dailyGoal}</span>
                </div>
              ` : ''}
              <div class="flex items-center gap-4 text-xs text-gray-500 pt-1 pl-1">
                <span class="flex items-center gap-1">
                  <i data-lucide="clock" class="w-3.5 h-3.5 text-gray-400"></i>
                  <span>期間: ${t.startDate} 〜 ${t.endDate} (${totalDays}日間)</span>
                </span>
                <span class="flex items-center gap-1 font-semibold text-orange-600">
                  <i data-lucide="flame" class="w-3.5 h-3.5"></i>
                  <span>達成状況: ${doneDaysCount} / ${totalDays} 日完了 (${percent}%)</span>
                </span>
              </div>
            </div>
            <div class="flex items-center gap-1">
              <button class="edit-btn px-2.5 py-1.5 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg text-xs font-medium">編集</button>
              <button class="delete-btn p-1.5 text-red-500 hover:text-red-700 hover:bg-red-50 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
          </div>
          <div class="mt-3 w-full bg-gray-100 h-2 rounded-full overflow-hidden">
            <div class="h-full transition-all duration-300 ${percent === 100 ? 'bg-[#84cc16]' : 'bg-[#1a73e8]'}" style="width: ${percent}%"></div>
          </div>
        `;

        item.querySelector('.edit-btn').onclick = () => openEditModal(t);
        item.querySelector('.delete-btn').onclick = () => {
          userEvents = userEvents.filter(e => e.id !== t.id);
          saveUserEvents();
          renderView();
        };

        container.appendChild(item);
      });

      lucide.createIcons();
    }

    window.switchToMonth = function(m) {
      currentMonth = m;
      currentView = 'month';
      renderView();
    };

    function renderMiniCalendar() {
      const miniGrid = document.getElementById('miniCalendarGrid');
      miniGrid.innerHTML = '';
      const days = generateMonthDays(currentYear, currentMonth);

      days.forEach((d, idx) => {
        const ach = getDayAchievement(d.dateKey);
        const btn = document.createElement('button');
        let style = 'text-gray-400 hover:bg-gray-100';

        if (d.dateKey === todayKey) {
          style = 'bg-[#1a73e8] text-white font-medium shadow-xs';
        } else if (d.dateKey === selectedDate) {
          style = 'bg-[#d2e3fc] text-[#174ea6] font-medium';
        } else if (ach.hasTask && ach.rate > 0) {
          style = ach.rate === 1.0 ? 'bg-[#84cc16] text-white font-bold' : 'bg-[#d9f99d] text-lime-800 font-medium';
        } else if (d.isCurrent) {
          style = 'text-gray-800 hover:bg-gray-200';
        }

        btn.className = `h-7 w-7 mx-auto my-0.5 rounded-full flex items-center justify-center transition-colors text-[11px] ${style}`;
        btn.textContent = d.num;
        btn.onclick = () => {
          selectedDate = d.dateKey;
          const [y, m] = d.dateKey.split('-').map(Number);
          currentYear = y;
          currentMonth = m;
          currentView = 'month';
          renderView();
        };
        miniGrid.appendChild(btn);
      });
    }

    function toggleDailyComplete(id, dateKey) {
      userEvents = userEvents.map(e => {
        if (e.id === id) {
          const comp = { ...(e.completedDates || {}) };
          comp[dateKey] = !comp[dateKey];
          return { ...e, completedDates: comp };
        }
        return e;
      });
      saveUserEvents();
      renderView();
    }

    function updateProgress() {
      let targetTotal = 0;
      let completedTotal = 0;
      userEvents.forEach(ev => {
        const days = calculateDaysCount(ev.startDate, ev.endDate);
        targetTotal += days;
        const compCount = Object.values(ev.completedDates || {}).filter(Boolean).length;
        completedTotal += compCount;
      });
      document.getElementById('taskProgressText').textContent = `${completedTotal} / ${targetTotal} 日`;
      document.getElementById('taskProgressBar').style.width = `${targetTotal > 0 ? (completedTotal / targetTotal) * 100 : 0}%`;
    }

    const modal = document.getElementById('eventModal');
    function updateDurationPreview() {
      const start = document.getElementById('eventStartDateInput').value;
      const end = document.getElementById('eventEndDateInput').value;
      const days = calculateDaysCount(start, end);
      document.getElementById('periodDaysPreview').textContent = `${days}日間`;
    }

    function openModal(startDate = selectedDate, endDate = selectedDate, tag = '勉強') {
      document.getElementById('eventId').value = '';
      document.getElementById('overallGoalInput').value = '';
      document.getElementById('dailyGoalInput').value = '';
      document.getElementById('eventStartDateInput').value = startDate;
      document.getElementById('eventEndDateInput').value = endDate;
      document.getElementById('eventTagInput').value = tag;
      document.getElementById('modalTitle').textContent = '目標・やることの設定';
      document.getElementById('deleteEventBtn').classList.add('hidden');
      document.getElementById('deleteEventBtn').classList.remove('flex');
      selectColor('blue');
      updateDurationPreview();
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function openEditModal(ev) {
      document.getElementById('eventId').value = ev.id;
      document.getElementById('overallGoalInput').value = ev.overallGoal || ev.title || '';
      document.getElementById('dailyGoalInput').value = ev.dailyGoal || '';
      document.getElementById('eventStartDateInput').value = ev.startDate || ev.date;
      document.getElementById('eventEndDateInput').value = ev.endDate || ev.startDate || ev.date;
      document.getElementById('eventTagInput').value = ev.tag || '勉強';
      document.getElementById('modalTitle').textContent = '目標・やることの編集';
      document.getElementById('deleteEventBtn').classList.remove('hidden');
      document.getElementById('deleteEventBtn').classList.add('flex');
      selectColor(ev.color || 'blue');
      updateDurationPreview();
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function selectColor(color) {
      currentColor = color;
      document.querySelectorAll('.color-btn').forEach(btn => {
        if (btn.dataset.color === color) {
          btn.className = `color-btn w-7 h-7 rounded-full ${colorClasses[color].bg} ring-2 ring-offset-2 ring-blue-500 scale-125 transition-all`;
        } else {
          btn.className = `color-btn w-7 h-7 rounded-full ${colorClasses[btn.dataset.color].bg} transition-all hover:scale-110`;
        }
      });
    }

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.onclick = () => selectColor(btn.dataset.color);
    });

    document.querySelectorAll('.tag-preset-btn').forEach(btn => {
      btn.onclick = () => {
        document.getElementById('eventTagInput').value = btn.dataset.tag;
        selectColor(btn.dataset.color);
      };
    });

    document.getElementById('eventStartDateInput').onchange = (e) => {
      const endInput = document.getElementById('eventEndDateInput');
      if (endInput.value < e.target.value) {
        endInput.value = e.target.value;
      }
      updateDurationPreview();
    };
    document.getElementById('eventEndDateInput').onchange = updateDurationPreview;

    document.getElementById('eventForm').onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById('eventId').value;
      const overallGoal = document.getElementById('overallGoalInput').value.trim();
      const dailyGoal = document.getElementById('dailyGoalInput').value.trim();
      const startDate = document.getElementById('eventStartDateInput').value;
      let endDate = document.getElementById('eventEndDateInput').value;
      if (endDate < startDate) endDate = startDate;
      const tag = document.getElementById('eventTagInput').value.trim() || '勉強';

      if (!overallGoal) return;

      if (id && !id.startsWith('sys-holiday-')) {
        userEvents = userEvents.map(ev => ev.id === id ? { ...ev, overallGoal, dailyGoal, startDate, endDate, tag, color: currentColor } : ev);
      } else {
        userEvents.push({
          id: `task-${Date.now()}`,
          overallGoal,
          dailyGoal,
          startDate,
          endDate,
          tag,
          color: currentColor,
          completedDates: {},
        });
      }
      saveUserEvents();
      closeModal();
      renderView();
    };

    document.getElementById('deleteEventBtn').onclick = () => {
      const id = document.getElementById('eventId').value;
      if (id) {
        userEvents = userEvents.filter(e => e.id !== id);
        saveUserEvents();
        closeModal();
        renderView();
      }
    };

    document.getElementById('prevBtn').onclick = () => {
      if (currentView === 'year') {
        currentYear--;
      } else {
        currentMonth--;
        if (currentMonth < 1) { currentMonth = 12; currentYear--; }
      }
      renderView();
    };

    document.getElementById('nextBtn').onclick = () => {
      if (currentView === 'year') {
        currentYear++;
      } else {
        currentMonth++;
        if (currentMonth > 12) { currentMonth = 1; currentYear++; }
      }
      renderView();
    };

    document.getElementById('miniPrevBtn').onclick = () => {
      currentMonth--;
      if (currentMonth < 1) { currentMonth = 12; currentYear--; }
      renderView();
    };
    document.getElementById('miniNextBtn').onclick = () => {
      currentMonth++;
      if (currentMonth > 12) { currentMonth = 1; currentYear++; }
      renderView();
    };

    document.getElementById('todayBtn').onclick = () => {
      currentYear = 2026;
      currentMonth = 11;
      selectedDate = '2026-11-11';
      renderView();
    };

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        selectedFilterTag = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => {
          if (b.dataset.filter === selectedFilterTag) {
            b.className = 'filter-btn text-[11px] px-2.5 py-1 rounded-full bg-[#1a73e8] text-white font-medium transition-all';
          } else {
            b.className = 'filter-btn text-[11px] px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-700 hover:border-gray-300 transition-all';
          }
        });
        renderView();
      };
    });

    const dropdownBtn = document.getElementById('viewDropdownBtn');
    const dropdownMenu = document.getElementById('viewDropdownMenu');
    dropdownBtn.onclick = (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('hidden');
    };
    document.addEventListener('click', () => {
      dropdownMenu.classList.add('hidden');
    });

    document.getElementById('selectMonthView').onclick = () => {
      currentView = 'month';
      dropdownMenu.classList.add('hidden');
      renderView();
    };
    document.getElementById('selectYearView').onclick = () => {
      currentView = 'year';
      dropdownMenu.classList.add('hidden');
      renderView();
    };
    document.getElementById('selectCheckListView').onclick = () => {
      currentView = 'checklist';
      dropdownMenu.classList.add('hidden');
      renderView();
    };

    const sidebar = document.getElementById('sidebar');
    const openBtn = document.getElementById('openSidebarBtn');
    const closeBtn = document.getElementById('closeSidebarBtn');

    openBtn.onclick = () => {
      sidebar.classList.remove('hidden');
      sidebar.classList.add('flex');
      openBtn.classList.add('hidden');
    };
    closeBtn.onclick = () => {
      sidebar.classList.add('hidden');
      sidebar.classList.remove('flex');
      openBtn.classList.remove('hidden');
    };

    document.getElementById('createEventBtn').onclick = () => openModal(selectedDate, selectedDate, '勉強');
    document.getElementById('addFromCheckListBtn').onclick = () => openModal(selectedDate, selectedDate, '勉強');
    document.getElementById('modalCloseBtn').onclick = closeModal;
    document.getElementById('modalCancelBtn').onclick = closeModal;

    const searchContainer = document.getElementById('searchContainer');
    const searchInput = document.getElementById('searchInput');
    const openSearchBtn = document.getElementById('openSearchBtn');
    const closeSearchBtn = document.getElementById('closeSearchBtn');

    openSearchBtn.onclick = () => {
      searchContainer.classList.remove('hidden');
      searchContainer.classList.add('flex');
      openSearchBtn.classList.add('hidden');
      searchInput.focus();
    };
    closeSearchBtn.onclick = () => {
      searchContainer.classList.add('hidden');
      searchContainer.classList.remove('flex');
      openSearchBtn.classList.remove('hidden');
      searchQuery = '';
      searchInput.value = '';
      renderView();
    };
    searchInput.oninput = (e) => {
      searchQuery = e.target.value;
      renderView();
    };

    document.getElementById('resetDataBtn').onclick = () => {
      if (confirm('登録した目標・やることデータを初期化しますか？')) {
        localStorage.removeItem('check_calendar_events');
        userEvents = DEFAULT_TASKS;
        saveUserEvents();
        renderView();
      }
    };

    renderView();
    lucide.createIcons();
  </script>
</body>
</html>
